<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="주식 깐부" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="theme-color" content="#FAFAFA" />
  <title>주식 깐부</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect fill='%23FAFAFA' width='64' height='64'/%3E%3Ccircle cx='26' cy='32' r='14' fill='%23111111'/%3E%3Ccircle cx='38' cy='32' r='14' fill='%23E11D48'/%3E%3C/svg%3E" />
  <link rel="apple-touch-icon" href="icon.png" />
  <style>
:root {
  --bg: #fafafa;
  --surface: #ffffff;
  --text: #262626;
  --text-2: #737373;
  --text-3: #a3a3a3;
  --line: #efefef;
  --up: #e11d48;
  --down: #2563eb;
  --accent: #262626;
  --chip: #f5f5f5;
  --radius: 10px;
  --tab-h: 58px;
  --pad: 20px;
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0f0f10;
    --surface: #171718;
    --text: #f4f4f5;
    --text-2: #a1a1aa;
    --text-3: #71717a;
    --line: #27272a;
    --chip: #1f1f22;
    --accent: #f4f4f5;
    --up: #fb7185;
    --down: #60a5fa;
  }
}

* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; min-height: 100dvh; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif;
  background: #e8eaed;
  color: var(--text);
  -webkit-font-smoothing: antialiased;
}

.device {
  min-height: 100dvh;
  display: flex;
  justify-content: center;
}
#app {
  width: min(100%, 430px);
  min-height: 100dvh;
  background: var(--bg);
  position: relative;
  display: flex;
  flex-direction: column;
}

.screen {
  flex: 1;
  overflow: auto;
  padding: calc(12px + env(safe-area-inset-top)) var(--pad) calc(var(--tab-h) + 20px + env(safe-area-inset-bottom));
}

.page-title {
  font-size: 22px;
  font-weight: 650;
  letter-spacing: -0.03em;
  margin: 4px 0 4px;
}
.brand-mark {
  width: 78px;
  height: 56px;
  position: relative;
  margin-bottom: 22px;
}
.brand-mark span {
  position: absolute;
  width: 44px;
  height: 44px;
  border-radius: 50%;
  top: 6px;
}
.brand-mark span:first-child { left: 0; background: #111; }
.brand-mark span:last-child { left: 28px; background: #e11d48; }
.brand-name {
  font-size: 34px;
  font-weight: 750;
  letter-spacing: -0.04em;
  margin: 0;
  line-height: 1.1;
}
.lead {
  font-size: 16px;
  color: var(--text-2);
  margin: 10px 0 32px;
  line-height: 1.45;
}
.screen.onboard {
  display: flex;
  flex-direction: column;
  justify-content: center;
  animation: rise 0.45s ease-out;
}
@keyframes rise {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: none; }
}
.empty-state {
  text-align: center;
  padding: 36px 12px 28px;
  display: flex;
  flex-direction: column;
  align-items: center;
}
.empty-state .brand-mark { margin-bottom: 16px; }
.empty-title {
  font-size: 18px;
  font-weight: 650;
  letter-spacing: -0.03em;
}
.empty-msg {
  font-size: 14px;
  color: var(--text-2);
  line-height: 1.5;
  margin: 8px 0 0;
  max-width: 260px;
}
.invite-chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  border: 0;
  background: var(--chip);
  color: var(--text);
  font: inherit;
  font-size: 12px;
  font-weight: 650;
  letter-spacing: 0.02em;
  padding: 8px 12px;
  border-radius: 999px;
}
.invite-chip span { color: var(--text-2); font-weight: 500; }
.header-actions { margin: 4px 0 14px; }
.profile-head { padding: 8px 0 8px; }
.avatar.lg { width: 72px; height: 72px; font-size: 26px; }
.page-sub {
  font-size: 13px;
  color: var(--text-2);
  margin: 0 0 20px;
  font-weight: 400;
}

.section {
  margin: 20px 0 0;
}
.section:has(.section-head) {
  margin: 0;
  border-bottom: 1px solid var(--line);
}
.section-title {
  font-size: 13px;
  font-weight: 600;
  color: var(--text-2);
  margin: 0 0 8px;
  letter-spacing: -0.01em;
}
.section-head {
  width: 100%;
  display: flex;
  align-items: center;
  gap: 8px;
  background: none;
  border: 0;
  padding: 14px 0;
  color: var(--text-2);
  font-size: 13px;
  font-weight: 650;
  text-align: left;
}
.section-head .label { flex-shrink: 0; }
.section-head .count,
.section-head .preview {
  margin-left: auto;
  font-size: 12px;
  font-weight: 500;
  color: var(--text-3);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  max-width: 48%;
  font-variant-numeric: tabular-nums;
}
.section-head .chev {
  width: 16px;
  height: 16px;
  color: var(--text-3);
  display: grid;
  place-items: center;
  flex-shrink: 0;
  transition: transform 0.18s ease;
}
.section-head .chev svg {
  width: 16px;
  height: 16px;
  display: block;
}
.section-head .chev.up { transform: rotate(180deg); }
.section-body { padding-bottom: 12px; }
.members-sec {
  border-bottom: 1px solid var(--line);
  padding: 14px 0 8px;
}
.members-sec .section-title { margin: 0 0 10px; }

.pager {
  display: flex;
  overflow-x: auto;
  scroll-snap-type: x mandatory;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
}
.pager::-webkit-scrollbar { display: none; }
.pager-slide {
  flex: 0 0 100%;
  scroll-snap-align: start;
  scroll-snap-stop: always;
}
.pager-slide .action-block {
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 14px 16px;
  background: var(--surface);
}
.pager-nav {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  padding: 4px 0 2px;
}
.pager-idx {
  font-size: 11px;
  color: var(--text-3);
  font-variant-numeric: tabular-nums;
}
.pager-dots {
  display: flex;
  gap: 5px;
}
.pager-dots button {
  width: 6px;
  height: 6px;
  padding: 0;
  border: 0;
  border-radius: 50%;
  background: var(--line);
}
.pager-dots button.on { background: var(--text); }

.row-list { border-top: 1px solid var(--line); }
.row {
  display: flex;
  align-items: flex-start;
  gap: 12px;
  padding: 14px 0;
  border-bottom: 1px solid var(--line);
  background: transparent;
}
.row.btn {
  width: 100%;
  text-align: left;
  border-left: 0;
  border-right: 0;
  border-top: 0;
  font: inherit;
  color: inherit;
  cursor: pointer;
}

.stock-name {
  font-size: 16px;
  font-weight: 600;
  letter-spacing: -0.02em;
  display: inline-flex;
  align-items: center;
  gap: 5px;
}
.verified {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 14px;
  height: 14px;
  border-radius: 50%;
  background: #3897f0;
  color: #fff;
  font-size: 9px;
  font-weight: 800;
  line-height: 1;
  flex-shrink: 0;
}
.kind {
  font-size: 11px;
  font-weight: 600;
  color: var(--text-3);
  letter-spacing: 0.01em;
  margin-bottom: 6px;
}
.ticker {
  font-size: 12px;
  color: var(--text-3);
  font-variant-numeric: tabular-nums;
  margin-top: 2px;
}
.pct {
  font-size: 16px;
  font-weight: 600;
  font-variant-numeric: tabular-nums;
  letter-spacing: -0.03em;
  white-space: nowrap;
}
.pct.up { color: var(--up); }
.pct.down { color: var(--down); }
.meta {
  font-size: 13px;
  color: var(--text-2);
  margin-top: 6px;
  line-height: 1.45;
}
.caption {
  font-size: 12px;
  color: var(--text-3);
  margin-top: 4px;
}

.grow { flex: 1; min-width: 0; }
.right { text-align: right; }

.avatar {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  font-size: 13px;
  font-weight: 650;
  color: #fff;
  flex-shrink: 0;
  background: #6b7280;
}
.avatar.sm { width: 32px; height: 32px; font-size: 12px; }
.avatar.c0 { background: #405DE6; }
.avatar.c1 { background: #C13584; }
.avatar.c2 { background: #F77737; }
.avatar.c3 { background: #833AB4; }
.avatar.c4 { background: #1FA2F1; }
.avatar.c5 { background: #2BB673; }

.stock-mark {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  font-size: 15px;
  font-weight: 750;
  letter-spacing: -0.04em;
  flex-shrink: 0;
  overflow: hidden;
  font-family: -apple-system, "SF Pro Rounded", "Apple SD Gothic Neo", sans-serif;
}
.stock-mark.sm { width: 32px; height: 32px; font-size: 12px; }
.stock-mark.lg { width: 52px; height: 52px; font-size: 20px; }
.stock-mark img {
  width: 58%;
  height: 58%;
  object-fit: contain;
  display: none;
}
.stock-mark.has-logo img { display: block; }
.stock-mark .stock-glyph { display: grid; place-items: center; }
.stock-mark.has-logo .stock-glyph { display: none; }
.stock-mark.logo-failed img { display: none; }
.stock-mark.logo-failed .stock-glyph { display: grid; }

.icon-meta {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  color: var(--text-2);
  font-size: 12px;
  font-weight: 550;
  background: none;
  border: 0;
  padding: 0;
  font-variant-numeric: tabular-nums;
}
.icon-meta svg {
  width: 18px;
  height: 18px;
  display: block;
}

.news {
  font-size: 12px;
  color: var(--text-2);
  margin-top: 4px;
  line-height: 1.4;
}
.vibe {
  font-size: 12px;
  font-weight: 600;
  color: var(--text-2);
  margin-top: 4px;
}
.pulse { margin-top: 6px; }
.pulse-top {
  display: flex;
  align-items: center;
  gap: 6px;
  min-width: 0;
}
.pulse-chip {
  font-size: 11px;
  font-weight: 650;
  padding: 3px 7px;
  border-radius: 999px;
  background: var(--chip);
  color: var(--text-2);
  flex-shrink: 0;
}
.pulse-chip.glory { color: var(--up); background: rgba(225, 29, 72, 0.12); }
.pulse-chip.roast { color: var(--down); background: rgba(37, 99, 235, 0.12); }
.pulse-take {
  font-size: 12px;
  font-weight: 500;
  color: var(--text-2);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.pulse-blurb {
  font-size: 12px;
  color: var(--text-3);
  margin: 4px 0 2px;
}
.pulse-label {
  font-size: 11px;
  font-weight: 650;
  color: var(--text-3);
  margin: 6px 0 2px;
}
.pulse-news-row {
  display: flex;
  justify-content: space-between;
  gap: 10px;
  font-size: 12px;
  color: var(--text);
  line-height: 1.45;
  padding: 3px 0;
}
.pulse-news-row span:last-child {
  color: var(--text-3);
  flex-shrink: 0;
  font-size: 11px;
}
.row-block {
  padding: 14px 0;
  border-bottom: 1px solid var(--line);
}
.row-block .row {
  padding: 0;
  border-bottom: 0;
}
.take-steps {
  display: flex;
  gap: 4px;
  margin: 8px 0 4px;
}
.take-step {
  flex: 1;
  min-height: 36px;
  padding: 6px 2px;
  border-radius: 10px;
  border: 1px solid var(--line);
  background: var(--surface);
  color: var(--text-3);
  font-size: 11px;
  font-weight: 700;
  letter-spacing: -0.02em;
}
.take-step.on { color: var(--text); background: var(--chip); }
.take-step.on.glory {
  color: var(--up);
  border-color: rgba(225, 29, 72, 0.28);
  background: rgba(225, 29, 72, 0.12);
}
.take-step.on.roast {
  color: var(--down);
  border-color: rgba(37, 99, 235, 0.28);
  background: rgba(37, 99, 235, 0.12);
}
.news-card {
  display: flex;
  gap: 10px;
  align-items: stretch;
  padding: 8px 0;
  color: inherit;
  text-decoration: none;
}
.news-card + .news-card { border-top: 1px solid var(--line); }
.news-thumb {
  width: 72px;
  height: 54px;
  border-radius: 8px;
  object-fit: cover;
  background: var(--chip);
  flex-shrink: 0;
}
.news-body {
  min-width: 0;
  flex: 1;
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 4px;
}
.news-title {
  font-size: 13px;
  font-weight: 650;
  letter-spacing: -0.03em;
  line-height: 1.35;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.news-meta { font-size: 11px; color: var(--text-3); }
.chart-box { margin: 2px 0 16px; }
.chart-cap {
  font-size: 12px;
  color: var(--text-3);
  line-height: 1.45;
}
.chart-meta {
  margin-top: 6px;
  font-size: 12px;
  font-weight: 550;
  color: var(--text-2);
  font-variant-numeric: tabular-nums;
}
.chart {
  width: 100%;
  height: auto;
  display: block;
  margin-top: 8px;
  color: var(--text);
  cursor: pointer;
  touch-action: none;
}

.feed-badge {
  position: absolute;
  right: -2px;
  bottom: -2px;
  width: 14px;
  height: 14px;
  border-radius: 50%;
  color: #fff;
  display: grid;
  place-items: center;
}
.feed-badge svg { width: 8px; height: 8px; }
.avatar-wrap { position: relative; flex-shrink: 0; }

.members {
  display: flex;
  gap: 14px;
  overflow-x: auto;
  padding: 4px 0 8px;
}
.member {
  border: 0;
  background: none;
  padding: 0;
  min-width: 52px;
  text-align: center;
  cursor: pointer;
  color: var(--text);
  font: inherit;
}
.members.story { padding: 2px 0 12px; }
.member .avatar {
  width: 56px;
  height: 56px;
  font-size: 18px;
  box-shadow: 0 0 0 1px var(--line);
}
.member span {
  display: block;
  margin-top: 6px;
  font-size: 12px;
  font-weight: 500;
}

.actions {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 10px;
}

button {
  font: inherit;
  cursor: pointer;
  touch-action: manipulation;
  -webkit-tap-highlight-color: rgba(0, 0, 0, 0.08);
}
.btn {
  border: 0;
  border-radius: 12px;
  padding: 14px 16px;
  min-height: 48px;
  font-size: 15px;
  font-weight: 600;
}
.btn.primary {
  background: var(--accent);
  color: var(--bg);
}
.btn.secondary {
  background: var(--chip);
  color: var(--text);
}
.btn.ghost {
  background: transparent;
  color: var(--text-2);
  padding-left: 0;
  min-height: 0;
}
.btn.text {
  background: none;
  border: 0;
  color: var(--text);
  font-size: 15px;
  font-weight: 550;
  padding: 6px 0;
  min-height: 0;
}
.btn.full { width: 100%; }
.btn.sm {
  min-height: 32px;
  padding: 7px 10px;
  font-size: 12px;
  font-weight: 550;
  background: var(--chip);
  color: var(--text);
  border: 0;
  border-radius: 8px;
}

.status {
  font-size: 11px;
  font-weight: 500;
  color: var(--text-3);
  white-space: nowrap;
}

.action-block {
  padding: 14px 0;
  border-bottom: 1px solid var(--line);
}
.action-block h4 {
  margin: 0 0 4px;
  font-size: 15px;
  font-weight: 600;
}
.action-block p {
  margin: 0 0 10px;
  font-size: 13px;
  color: var(--text-2);
  line-height: 1.45;
}

.feed-item {
  display: flex;
  gap: 12px;
  padding: 14px 0;
  border-bottom: 1px solid var(--line);
}
.feed-item b {
  display: block;
  font-size: 14px;
  font-weight: 600;
  margin-bottom: 2px;
}
.feed-item .body {
  font-size: 14px;
  color: var(--text);
  line-height: 1.45;
}
.feed-item .time {
  font-size: 12px;
  color: var(--text-3);
  margin-top: 6px;
}

.pair-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 12px 0;
  border-bottom: 1px solid var(--line);
}
.pair-row .names {
  font-size: 14px;
  font-weight: 600;
}
.pair-row .stock {
  font-size: 13px;
  color: var(--text-2);
  margin-top: 2px;
}
.grade {
  font-size: 13px;
  font-weight: 650;
  margin-top: 2px;
}
.grade.glory, .kind.glory, .mood.glory { color: var(--up); }
.grade.roast, .kind.roast, .mood.roast { color: var(--down); }
.grade.plain { color: var(--text-2); }
.mood {
  font-size: 12px;
  font-weight: 600;
  margin: 0 0 10px;
  line-height: 1.4;
}

.header-meta {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 12px;
  margin-bottom: 16px;
}
.invite {
  font-size: 12px;
  color: var(--text-3);
  font-variant-numeric: tabular-nums;
}

input, select, textarea {
  width: 100%;
  font: inherit;
  font-size: 16px;
  padding: 12px 0;
  border: 0;
  border-bottom: 1px solid var(--line);
  background: transparent;
  color: var(--text);
  margin: 4px 0 16px;
  border-radius: 0;
  outline: none;
}
label {
  font-size: 12px;
  color: var(--text-2);
  font-weight: 500;
}

.note {
  font-size: 12px;
  color: var(--text-3);
  line-height: 1.5;
  margin: 12px 0 16px;
}

.tabs {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  height: calc(var(--tab-h) + env(safe-area-inset-bottom));
  padding-bottom: env(safe-area-inset-bottom);
  background: color-mix(in srgb, var(--surface) 88%, transparent);
  -webkit-backdrop-filter: saturate(160%) blur(18px);
  backdrop-filter: saturate(160%) blur(18px);
  border-top: 1px solid var(--line);
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  z-index: 6;
}
.tabs button {
  background: none;
  border: 0;
  color: var(--text-3);
  font-size: 10px;
  font-weight: 500;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 3px;
}
.tabs button svg {
  width: 24px;
  height: 24px;
  display: block;
}
.tabs button.on { color: var(--text); font-weight: 650; }

.sheet {
  position: fixed;
  inset: 0;
  background: rgba(17, 17, 17, 0.4);
  display: flex;
  align-items: flex-end;
  z-index: 40;
}
.sheet .panel {
  background: var(--surface);
  width: 100%;
  max-width: 430px;
  margin: 0 auto;
  border-radius: 18px 18px 0 0;
  padding: 10px var(--pad) calc(24px + env(safe-area-inset-bottom));
  max-height: 86%;
  overflow: auto;
  -webkit-overflow-scrolling: touch;
}
.grabber {
  width: 36px;
  height: 5px;
  border-radius: 99px;
  background: var(--line);
  margin: 4px auto 14px;
}
.sheet h2 {
  font-size: 18px;
  font-weight: 650;
  margin: 0 0 8px;
}

.toast {
  position: fixed;
  left: 50%;
  bottom: calc(var(--tab-h) + 18px + env(safe-area-inset-bottom));
  transform: translateX(-50%);
  background: #111;
  color: #fff;
  padding: 10px 14px;
  border-radius: 8px;
  z-index: 20;
  font-size: 13px;
  font-weight: 500;
}

.stack { display: flex; flex-direction: column; gap: 8px; }
.split { display: flex; gap: 8px; }
.split > * { flex: 1; }

.thread-head {
  display: flex;
  flex-direction: column;
  gap: 10px;
  margin-bottom: 12px;
}

function stock(id) { return state.stocks.find((s) => s.id === id); }
function user(id) { return state.users.find((u) => u.id === id); }
function nickname(id) { return user(id)?.nickname || "?"; }
function group() { return state.groups.find((g) => g.id === state.selectedGroupId); }
function memberUsers() {
  const g = group();
  if (!g) return [];
  return state.members.filter((m) => m.groupId === g.id).map((m) => user(m.userId)).filter(Boolean);
}
function activeHoldings(userId) {
  return state.holdings.filter((h) => h.userId === userId && h.status === "holding");
}
function bonds() {
  const g = group();
  if (!g) return [];
  const memberIds = new Set(memberUsers().map((u) => u.id));
  const active = state.holdings.filter((h) => h.status === "holding" && memberIds.has(h.userId));
  const byStock = {};
  active.forEach((h) => { (byStock[h.stockId] ||= []).push(h); });
  const out = [];
  Object.entries(byStock).forEach(([stockId, hs]) => {
    const unique = [];
    const seen = new Set();
    hs.forEach((h) => { if (!seen.has(h.userId)) { seen.add(h.userId); unique.push(h); } });
    if (unique.length < 2) return;
    for (let i = 0; i < unique.length; i++) {
      for (let j = i + 1; j < unique.length; j++) {
        const a = unique[i], b = unique[j];
        const p = priceOf(stock(stockId));
        const shared = (ret(a.averagePrice, p) + ret(b.averagePrice, p)) / 2;
        out.push({ stockId, a: a.userId, b: b.userId, shared, grade: gradeFor(shared) });
      }
    }
  });
  return out;
}
function partnersOf(userId, stockId) {
  return bonds()
    .filter((b) => b.stockId === stockId && (b.a === userId || b.b === userId))
    .map((b) => nickname(b.a === userId ? b.b : b.a));
}
function toast(msg) {
  state.toast = msg;
  const el = document.getElementById("toast");
  el.hidden = false;
  el.textContent = msg;
  clearTimeout(toast._t);
  toast._t = setTimeout(() => { el.hidden = true; }, 2200);
}
function pushEvent(title, message, type, actorId, stockId) {
  const g = group();
  state.events.unshift(ev(g.id, title, message, now(), type, actorId || state.me.id, stockId));
}

function inbox() {
  const me = state.me.id;
  const items = [];
  state.recs.filter((r) => r.receiverId === me && (r.status === "pending" || r.status === "willBuy")).forEach((r) => items.push({ kind: "recommend", rec: r }));
  state.proposals.forEach((p) => {
    const mine = state.cobuys.find((c) => c.proposalId === p.id && c.userId === me);
    const nagger = state.cobuys.find((c) => c.proposalId === p.id && (c.nagCount || 0) > 0);
    if (!mine) {
      items.push({ kind: nagger ? "nag" : "proposal", proposal: p });
    }
  });
  state.holdings.filter((h) => h.userId === me && (h.verification === "suspected" || h.verification === "mismatch")).forEach((h) => {
    items.push({ kind: "suspect", holding: h });
  });
  return items;
}

function blendedAverage(oldAvg, oldQty, addPrice, addQty) {
  const total = oldQty + addQty;
  if (!(oldAvg > 0) || !(addPrice > 0) || !(oldQty > 0) || !(addQty > 0) || !(total > 0)) return null;
  return (oldAvg * oldQty + addPrice * addQty) / total;
}

function addToPosition(id) {
  const h = state.holdings.find((x) => x.id === id && x.userId === state.me.id);
  if (!h || h.status !== "holding") return;
  const s = stock(h.stockId);
  const addPrice = Number(document.getElementById("add-price")?.value);
  const addQty = Number(document.getElementById("add-qty")?.value);
  const oldQty = h.quantity || Number(document.getElementById("old-qty")?.value);
  const direct = Number(document.getElementById("new-avg")?.value);
  const directQty = Number(document.getElementById("new-qty")?.value);
  const blended = blendedAverage(h.averagePrice, oldQty, addPrice, addQty);
  if (blended != null) {
    h.averagePrice = blended;
    h.quantity = oldQty + addQty;
  } else if (direct > 0) {
    if (Math.abs(direct - h.averagePrice) < 1e-9 && !(directQty > 0 && directQty !== h.quantity)) {
      toast("바꿀 값이 없습니다.");
      return;
    }
    h.averagePrice = direct;
    if (directQty > 0) h.quantity = directQty;
  } else {
    toast("추가 매수가와 수량을 적거나, 새 평단을 적어 주세요.");
    return;
  }
  if (h.verification === "mismatch") h.verification = "unverified";
  pushEvent("평단 수정", `${nickname(state.me.id)}가 ${s.name} 평단을 ${formatPrice(h.averagePrice, s.market)}로 고쳤습니다.`, "rec", state.me.id, h.stockId);
  toast("평단 " + formatPrice(h.averagePrice, s.market) + "로 바꿨습니다");
  state.sheet = null;
  state.addTicker = null;
  state.addPrice = "";
  state.chartIndex = null;
  render();
}

function addHolding(ticker, avg, method = "manual") {
  if (activeHoldings(state.me.id).some((h) => h.stockId === ticker)) {
    toast("이미 보유 중인 종목입니다. 추매에서 평단을 고치세요.");
    return;
  }
  const s = stock(ticker);
  const holding = {
    id: uid(), userId: state.me.id, stockId: ticker, averagePrice: avg,
    status: "holding", verification: method === "screenshot" ? "screenshot" : "unverified", createdAt: now()
  };
  state.holdings.push(holding);
  const newBonds = bonds().filter((b) => b.stockId === ticker && (b.a === state.me.id || b.b === state.me.id));
  newBonds.forEach((b) => {
    const other = b.a === state.me.id ? b.b : b.a;
    pushEvent("깐부", `${s.name} · ${nickname(other)}`, "kk");
  });
  state.cobuys.filter((c) => c.userId === state.me.id && c.stockId === ticker && c.status === "promised").forEach((c) => {
    c.status = "registered";
  });
  let fromRec = false;
  state.recs.filter((r) => r.receiverId === state.me.id && r.stockId === ticker && (r.status === "pending" || r.status === "willBuy")).forEach((r) => {
    r.status = "accepted";
    fromRec = true;
  });
  if (fromRec) {
    pushEvent("추천 수락", `${s.name}를 사서 기록했습니다.`, "rec");
    toast(`${s.name}를 사서 기록했습니다`);
  } else {
    toast(`${s.name} 기록됨`);
  }
  state.sheet = null;
  state.addTicker = null;
  state.addPrice = "";
  state.chartIndex = null;
  render();
}

function sellHolding(id) {
  const h = state.holdings.find((x) => x.id === id);

  const s = stock(h.stockId);

  h.status = "sold";
  h.sellPrice = p;
  const leftovers = state.holdings.filter((x) => x.stockId === h.stockId && x.status === "holding" && x.userId !== h.userId);
  if (leftovers.length) {
    pushEvent("혼자 매도", `${s.name}를 매도했습니다. ${nickname(leftovers[0].userId)}는 아직 보유 중.`, "solo");

  toast("의심을 남겼습니다. 단정은 하지 않습니다.");
  render();
}

function verify(holdingId) {
  const h = state.holdings.find((x) => x.id === holdingId);
  h.verification = "screenshot";
  pushEvent("인증", `${stock(h.stockId).name} 매수가를 인증했습니다.`, "shot");
  toast("캡처 인증 완료");
  state.sheet = null;
  render();
}

function shock(ticker, pct) {
  stock(ticker).offset += pct;
  toast("시세가 반영되었습니다");
  const s = stock(ticker);
  const holders = state.holdings.filter((h) => h.stockId === ticker && h.status === "holding");
  if (pct > 0 && holders.length >= 2) {
    const pair = holders.slice(0, 2);
    pushEvent("황금 깐부", `${nickname(pair[0].userId)} · ${nickname(pair[1].userId)} · ${s.name}`, "gold", pair[0].userId);
  }
  const sold = state.holdings.filter((h) => h.stockId === ticker && h.status === "sold");
  if (pct > 0 && sold.length) {
    pushEvent("너무 이른 매도", `${s.name}를 너무 일찍 매도했습니다.`, "early", sold[0].userId);
  }
  if (pct < 0 && sold.length) {
    pushEvent("선견지명", `${s.name}를 미리 정리했습니다.`, "foresight", sold[0].userId);
  }
  render();
}

function playAs(userId) {

function esc(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

function initial(name) {
  return (name || "?").trim().slice(0, 1);
}
function avatarHTML(person, size) {
  const id = person.id || person.nickname || "x";
  const n = [...String(id)].reduce((a, c) => a + c.charCodeAt(0), 0) % 6;
  return `<div class="avatar c${n}${size === "sm" ? " sm" : size === "lg" ? " lg" : ""}">${esc(initial(person.nickname))}</div>`;
}
function brandMark() {

function emptyStateHTML(title, message) {

function sm(label, action) {

function holdingRow(h, isMine) {
  const s = stock(h.stockId);
  const p = h.status === "sold" ? (h.sellPrice || priceOf(s)) : priceOf(s);

  const partners = partnersOf(h.userId, h.stockId);
  const bond = bonds().find((b) => b.stockId === h.stockId && (b.a === h.userId || b.b === h.userId));
  const g = bond?.grade;
  const owner = user(h.userId);
  let actions = "";
  if (isMine && h.status === "holding") {
    actions = sm("친구에게 추천", `open-rec:${h.id}`) + sm("추매", `addon:${h.id}`) + sm("매도", `sell:${h.id}`);
    if (h.verification !== "screenshot") actions += sm("캡처 인증", `verify:${h.id}`);
  }
  const partnerLine = partners.length && g
    ? `${esc(partners.join(" · "))}와 <span class="grade ${g.kick}">${esc(g.title)}</span>`
    : "";
  const suspect = h.verification === "suspected" ? `<div class="caption">매수가 의심 중</div>` : "";
  return `
    <div class="row">
      ${stockMark(s)}

function isOpen(id, fallback) {
  if (state.groupOpen && state.groupOpen[id] === true) return true;
  if (state.groupOpen && state.groupOpen[id] === false) return false;
  return !!fallback;
}
function foldSection(id, title, count, preview, body, fallbackOpen) {
  const open = isOpen(id, fallbackOpen);
  const extra = !open && preview
    ? `<span class="preview">${esc(preview)}</span>`
    : `<span class="count">${count || ""}</span>`;
  return `<div class="section ${open ? "open" : ""}">
    <button type="button" class="section-head" data-act="fold:${id}" aria-expanded="${open}">
      <span class="label">${esc(title)}</span>
      ${extra}
      <span class="chev${open ? " up" : ""}">${ico("down")}</span>
    </button>
    ${open ? `<div class="section-body">${body}</div>` : ""}
  </div>`;
}
function turnPager(items) {
  if (!items.length) return "";
  const page = Math.max(0, Math.min(state.inboxPage || 0, items.length - 1));
  const body = `<div class="pager" id="turn-pager">
      ${items.map((it) => `<div class="pager-slide">${inboxBlock(it)}</div>`).join("")}
    </div>
    ${items.length > 1 ? `<div class="pager-nav">
      <span class="pager-idx">${page + 1} / ${items.length}</span>
      <div class="pager-dots">${items.map((_, i) => `<button type="button" class="${i === page ? "on" : ""}" data-act="page:${i}"></button>`).join("")}</div>
    </div>` : ""}`;
  return foldSection("turn", "내 차례", items.length, "", body, true);
}
function bindPager() {
  const pager = document.getElementById("turn-pager");
  if (!pager) return;
  const slides = pager.querySelectorAll(".pager-slide");
  const n = slides.length;
  if (!n) return;
  const sync = () => {
    const i = Math.max(0, Math.min(n - 1, Math.round(pager.scrollLeft / Math.max(pager.clientWidth, 1))));
    state.inboxPage = i;
    const idx = document.querySelector(".pager-idx");
    if (idx) idx.textContent = (i + 1) + " / " + n;
    document.querySelectorAll(".pager-dots button").forEach((d, k) => d.classList.toggle("on", k === i));
  };
  pager.addEventListener("scroll", sync, { passive: true });
  requestAnimationFrame(() => {
    pager.scrollLeft = (state.inboxPage || 0) * pager.clientWidth;
    sync();
  });
}

function recommendedSection() {

  if (!ids.length) return "";
  const lastName = stock(ids[0])?.name || "";
  const body = ids.map((id) => {
    const s = stock(id);
    const related = recs.filter((r) => r.stockId === id);
    const last = related[related.length - 1];
    return `<div class="row-block">

        <div class="grow">

      ${pulseStrip(id, true)}

  }).join("");

}

        ${sm("TSLA +15%", "shock:TSLA:0.15")}
        ${sm("TSLA -15%", "shock:TSLA:-0.15")}
        ${sm("AAPL +8%", "shock:AAPL:0.08")}
      </div>
    </div>
    <div class="section">
      <div class="section-title">친구로 보기</div>
      <p class="note">한 브라우저에서 상대 화면을 확인합니다.</p>
      <div class="actions">${memberUsers().map((u) => sm(u.nickname, `play:${u.id}`)).join("")}</div>
    </div>
    <div class="section">${btn("데모 리셋", "secondary full", "reset")}</div>
  </div>`;
}

function sheetWrap(inner) {
  return `<div class="sheet"><div class="panel"><div class="grabber"></div>${inner}</div></div>`;
}

function sheetHTML() {
  if (!state.sheet) return "";
  if (state.sheet === "add" || state.sheet.startsWith("register:")) {
    const pre = state.sheet.startsWith("register:") ? state.sheet.split(":")[1] : "";
    const selectedId = state.addTicker || pre || state.stocks[0]?.id;
    const selected = stock(selectedId) || state.stocks[0];
    const options = state.stocks.map((s) => `<option value="${s.id}" ${s.id === selectedId ? "selected" : ""}>${s.name} (${s.ticker})</option>`).join("");
    const priceVal = state.addPrice || "";
    return sheetWrap(`
      <h2>주식 추가</h2>
      <p class="note">${pre ? "추천받은 종목입니다. 샀으면 내가 산 가격을 적으세요. 현재가로 채우지 않습니다." : "목록에서 종목을 고르고, 차트에서 그날 가격을 고르거나 직접 적으세요. 캡처는 iOS 앱에 있습니다."}</p>
      <label>종목</label>
      <select id="add-ticker">${options}</select>
      ${selected ? chartPickHTML(selected) : ""}
      <label>매수가</label>
      <input id="add-price" type="number" step="0.01" placeholder="내가 산 가격" value="${esc(priceVal)}" />
      ${btn("등록", "primary full", "do-add")}
      <div style="height:8px"></div>
      ${btn("닫기", "secondary full", "close")}
    `);
  }
  if (state.sheet.startsWith("addon:")) {
    const hid = state.sheet.split(":")[1];
    const h = state.holdings.find((x) => x.id === hid);
    const s = h ? stock(h.stockId) : null;
    if (!h || !s) return "";
    const priceVal = state.addPrice || "";
    const avgVal = String(s.market === "krx" ? Math.round(h.averagePrice) : h.averagePrice);
    return sheetWrap(`
      <h2>추매 · 평단</h2>
      <p class="note">더 산 가격과 수량을 적으면 평단이 다시 계산됩니다. 평단만 고쳐도 됩니다. 현재가로 채우지 않습니다.</p>
      <div class="row" style="border:0;padding:0 0 8px">
        ${stockMark(s)}
        <div class="grow">
          <div class="stock-name">${esc(s.name)}</div>
          <div class="meta">지금 평단 ${formatPrice(h.averagePrice, s.market)}${h.quantity ? " · 수량 " + h.quantity : ""}</div>
        </div>
      </div>
      <input type="hidden" id="add-ticker" value="${esc(s.id)}" />
      ${chartPickHTML(s)}
      <label>추가 매수가</label>
      <input id="add-price" type="number" step="0.01" placeholder="더 산 가격" value="${esc(priceVal)}" />
      ${h.quantity ? "" : `<label>기존 수량</label><input id="old-qty" type="number" step="0.0001" placeholder="지금 몇 주인지" />`}
      <label>추가 수량</label>
      <input id="add-qty" type="number" step="0.0001" placeholder="몇 주 더 샀나요" />
      <label>또는 새 평단</label>
      <input id="new-avg" type="number" step="0.01" value="${esc(avgVal)}" />
      <label>수량 (선택)</label>
      <input id="new-qty" type="number" step="0.0001" value="${h.quantity ? esc(String(h.quantity)) : ""}" />
      ${btn("반영", "primary full", "do-addon")}
      <div style="height:8px"></div>
      ${btn("닫기", "secondary full", "close")}
    `);
  }
  if (state.sheet.startsWith("open-rec:")) {
    const hid = state.sheet.split(":")[1];
    const others = memberUsers().filter((u) => u.id !== state.me.id);
    return sheetWrap(`
      <h2>친구에게 추천</h2>
      <p class="note">이미 내가 보유한 종목을 친구에게 알립니다. 한마디를 적으면 추천 히스토리에 남습니다.</p>
      <label>한마디</label>
      <input id="rec-msg" value="같이 들어가 봐." />
      ${others.map((u) => `<div style="margin-bottom:8px">${btn(u.nickname + "에게", "secondary full", `send-rec:${hid}:${u.id}`)}</div>`).join("")}
      ${btn("닫기", "ghost full", "close")}
    `);
  }
  if (state.sheet.startsWith("open-prop")) {
    const pre = state.sheet.split(":")[1] || "AMD";
    const options = state.stocks.map((s) => `<option value="${s.id}" ${s.id === pre ? "selected" : ""}>${s.name}</option>`).join("");
    return sheetWrap(`
      <h2>매수 제안</h2>
      <p class="note">아직 안 산 종목을 그룹에 제안합니다.</p>
      <label>종목</label>
      <select id="prop-ticker">${options}</select>
      <label>메시지</label>
      <input id="prop-msg" value="이번에 같이 들어갈 사람?" />
      ${btn("보내기", "primary full", "do-prop")}
      <div style="height:8px"></div>
      ${btn("닫기", "secondary full", "close")}
    `);
  }
  if (state.sheet === "rank") {
    const rows = memberUsers().map((u) => {
      const hs = state.holdings.filter((h) => h.userId === u.id && h.status === "holding");
      const avg = hs.length ? hs.map((h) => ret(h.averagePrice, priceOf(stock(h.stockId)))).reduce((a, b) => a + b, 0) / hs.length : 0;
      return { u, avg, n: hs.length };
    }).sort((a, b) => b.avg - a.avg);
    return sheetWrap(`
      <h2>랭킹</h2>
      <p class="note">그룹 안 기록입니다. 금융 리그가 아닙니다.</p>
      ${rows.map((r, i) => `<div class="pair-row">
        ${avatarHTML(r.u, "sm")}
        <div class="grow">
          <div class="names">${esc(r.u.id === state.me.id ? "나" : r.u.nickname)}</div>
          <div class="stock">보유 ${r.n}종목</div>
        </div>
        <div class="pct ${r.avg >= 0 ? "up" : "down"}">${r.n ? formatPct(r.avg) : "—"}</div>
      </div>`).join("")}
      <div style="height:8px"></div>
      ${btn("닫기", "secondary full", "close")}
    `);
  }
  if (state.sheet.startsWith("thread:")) {
    const stockId = state.sheet.split(":")[1];
    const s = stock(stockId);
    if (!s) return "";
    const recs = state.recs.filter((r) => r.stockId === stockId && r.groupId === group()?.id).sort((a, b) => a.createdAt - b.createdAt);
    const comments = commentsFor(stockId);
    const roots = comments.filter((c) => !c.parentId);
    const reply = state.replyTo ? comments.find((c) => c.id === state.replyTo) : null;
    const commentHTML = (c, isReply) => `<div class="comment ${isReply ? "reply" : ""}">
      ${avatarHTML(user(c.authorId) || { nickname: "?" }, "sm")}
      <div class="grow">
        <div class="names">${esc(nickname(c.authorId))}</div>
        <div class="body">${esc(c.body)}</div>
        <div class="time">${relative(c.createdAt)}${!c.parentId ? ` · <button class="btn text" data-act="reply:${c.id}">답글</button>` : ""}</div>
      </div>
    </div>`;
    return sheetWrap(`
      <div class="thread-head">
        <div class="thread-title">
          ${stockMark(s, "lg")}
          <div class="grow">
            <h2 style="margin:0">${esc(s.name)}</h2>
            <div class="ticker">${esc(s.ticker)}</div>
          </div>
        </div>
        ${pulseStrip(s.id, false)}
      </div>
      <p class="note">이 종목을 추천한 기록과 댓글입니다. 한 줄 남기면 히스토리에 남습니다.</p>
      <div class="kind">추천 히스토리</div>
      ${recs.length ? recs.map((r) => `<div class="history-item">
        <div class="names">${esc(nickname(r.senderId))} → ${esc(nickname(r.receiverId))}</div>
        <div class="body">“${esc(r.message)}”</div>
        <div class="time">${esc(recStatusLabel(r.status))} · ${relative(r.createdAt)}</div>
      </div>`).join("") : `<p class="empty">아직 이 종목을 추천한 기록이 없습니다.</p>`}
      <div class="kind" style="margin-top:16px">댓글 ${comments.length}</div>
      ${roots.length ? roots.map((c) => commentHTML(c, false) + comments.filter((x) => x.parentId === c.id).map((x) => commentHTML(x, true)).join("")).join("") : `<p class="empty">아직 댓글이 없습니다. 이 추천에 한마디 남겨 보세요.</p>`}
      ${reply ? `<div class="caption">${esc(nickname(reply.authorId))}에게 답글 · <button class="btn text" data-act="cancel-reply">취소</button></div>` : ""}
      <label>${reply ? "답글" : "댓글"}</label>
      <input id="thread-text" placeholder="${reply ? "답글 적기" : "이 추천에 한마디"}" value="${esc(state.threadDraft || "")}" />
      ${btn("보내기", "primary full", "do-comment")}
      <div style="height:8px"></div>
      ${btn("닫기", "secondary full", "close")}
    `);
  }
  return "";
}

function tabs() {
  if (state.onboarding) return "";
  const items = [
    ["group", "그룹", "group"],
    ["hold", "내 주식", "chart"],
    ["act", "활동", "heart"],
    ["me", "프로필", "me"]
  ];
  return `<nav class="tabs">${items.map(([id, label, icon]) => `<button class="${state.tab === id ? "on" : ""}" data-act="tab:${id}">${ico(icon, state.tab === id)}<span>${label}</span></button>`).join("")}</nav>`;
}

function render() {
  const root = document.getElementById("app");
  let body = "";
  if (state.onboarding) body = renderOnboarding();
  else if (state.tab === "hold") body = renderHoldings();
  else if (state.tab === "act") body = renderActivity();
  else if (state.tab === "me") body = renderProfile();
  else body = renderGroup();
  root.innerHTML = body + tabs() + sheetHTML();
  bindPager();
}

let sheetGuard = 0;
function openSheet(name) {
  state.sheet = name;
  sheetGuard = Date.now() + 700;
  render();
}
function closeSheet() {
  if (Date.now() < sheetGuard) return;
  state.sheet = null;
  state.replyTo = null;
  state.addTicker = null;
  state.addPrice = "";
  state.chartIndex = null;
  render();
}

let chartTracking = false;
function onChartPointer(e) {
  const svg = e.target.closest && e.target.closest("svg.chart");
  if (!svg) return false;
  e.preventDefault();
  applyChartPick(e.clientX);
  return true;
}
document.addEventListener("pointerdown", (e) => {
  if (!onChartPointer(e)) return;
  chartTracking = true;
  if (e.target.setPointerCapture) {
    try { e.target.setPointerCapture(e.pointerId); } catch (_) {}
  }
});
document.addEventListener("pointermove", (e) => {
  if (!chartTracking) return;
  onChartPointer(e);
});
document.addEventListener("pointerup", () => { chartTracking = false; });
document.addEventListener("pointercancel", () => { chartTracking = false; });

document.addEventListener("change", (e) => {
  if (e.target && e.target.id === "add-ticker") {
    state.addTicker = e.target.value;
    state.chartIndex = null;
    state.addPrice = "";
    render();
  }
});
document.addEventListener("input", (e) => {
  if (e.target && e.target.id === "add-price") state.addPrice = e.target.value;
  if (e.target && e.target.id === "thread-text") state.threadDraft = e.target.value;
});

document.addEventListener("click", (e) => {
  if (e.target.closest && e.target.closest("svg.chart")) {
    e.preventDefault();
    return;
  }
  if (e.target.closest && e.target.closest("a[href]")) return;
  if (e.target.classList.contains("sheet")) {
    closeSheet();
    return;
  }
  const actEl = e.target.closest("[data-act]");
  if (!actEl) return;
  handle(actEl.getAttribute("data-act"));
});

function handle(act) {
  if (act === "demo") {
    const nick = document.getElementById("nick")?.value?.trim() || "나";
    state.me.nickname = nick;
    seed(state);
    toast("그룹에 참여했습니다");
    render();
    return;
  }
  if (act === "empty-start") {
    const nick = document.getElementById("nick")?.value?.trim() || "나";
    state.me.nickname = nick;
    state.onboarding = false;
    state.groups.push({ id: "g-empty", name: "내 그룹", invite: "SOLO", ownerId: state.me.id });
    state.selectedGroupId = "g-empty";
    state.members.push({ groupId: "g-empty", userId: state.me.id, joinedAt: now() });
    render();
    return;
  }
  if (act.startsWith("tab:")) { state.tab = act.split(":")[1]; render(); return; }
  if (act.startsWith("fold:")) {
    if (!state.groupOpen) state.groupOpen = { turn: true };
    const id = act.slice(5);
    const fallback = id === "turn";
    state.groupOpen[id] = !isOpen(id, fallback);
    render();
    return;
  }
  if (act.startsWith("page:")) {
    const pager = document.getElementById("turn-pager");
    const i = Number(act.split(":")[1]);
    state.inboxPage = i;
    if (pager) pager.scrollTo({ left: i * pager.clientWidth, behavior: "smooth" });
    document.querySelectorAll(".pager-dots button").forEach((d, k) => d.classList.toggle("on", k === i));
    const idx = document.querySelector(".pager-idx");
    const n = pager ? pager.querySelectorAll(".pager-slide").length : 0;
    if (idx && n) idx.textContent = (i + 1) + " / " + n;
    return;
  }
  if (act === "copy") { navigator.clipboard?.writeText((group() && group().invite) || "KKANBU"); toast("초대 코드 복사됨"); return; }
  if (act === "rank") { openSheet("rank"); return; }
  if (act === "open-add") {
    state.addTicker = null;
    state.addPrice = "";
    state.chartIndex = null;
    openSheet("add");
    return;
  }
  if (act === "close") { closeSheet(); return; }
  if (act === "do-add") {
    const ticker = document.getElementById("add-ticker").value;
    const price = Number(document.getElementById("add-price").value);
    if (!price) {
      toast("내가 산 가격을 적어 주세요. 현재가로 채워 넣지 않습니다.");
      return;
    }
    const method = state.chartIndex != null ? "chart" : "manual";
    addHolding(ticker, price, method);
    return;
  }
  if (act.startsWith("bought:")) {
    const rec = state.recs.find((r) => r.id === act.split(":")[1]);
    if (!rec) return;
    state.addTicker = rec.stockId;
    state.addPrice = "";
    state.chartIndex = null;
    openSheet("register:" + rec.stockId);
    return;
  }
  if (act.startsWith("accept:")) return acceptRec(act.split(":")[1], true);
  if (act.startsWith("reject:")) return acceptRec(act.split(":")[1], false);
  if (act.startsWith("promise:")) return promiseCoBuy(act.split(":")[1]);
  if (act.startsWith("later:")) return declineProposal(act.split(":")[1]);
  if (act.startsWith("register:")) {
    state.addTicker = act.split(":")[1];
    state.addPrice = "";
    state.chartIndex = null;
    openSheet(act);
    return;
  }
  if (act.startsWith("addon:")) {
    const h = state.holdings.find((x) => x.id === act.split(":")[1]);
    state.addTicker = h ? h.stockId : null;
    state.addPrice = "";
    state.chartIndex = null;
    openSheet(act);
    return;
  }
  if (act === "do-addon") {
    const id = (state.sheet || "").split(":")[1];
    addToPosition(id);
    return;
  }
  if (act.startsWith("sell:")) return sellHolding(act.split(":")[1]);
  if (act.startsWith("verify:")) return verify(act.split(":")[1]);
  if (act.startsWith("suspect:")) return suspect(act.split(":")[1]);
  if (act.startsWith("open-rec:")) { openSheet(act); return; }
  if (act.startsWith("open-prop")) { openSheet(act); return; }
  if (act.startsWith("send-rec:")) {
    const parts = act.split(":");
    const msg = document.getElementById("rec-msg")?.value;
    return recommend(parts[1], parts[2], msg);
  }
  if (act.startsWith("take:")) {
    const parts = act.split(":");
    const stockId = parts[1];
    const level = Number(parts[2]);
    if (!stockId || Number.isNaN(level)) return;
    if (!state.takes) state.takes = [];
    const idx = state.takes.findIndex((t) => t.stockId === stockId && t.userId === state.me.id);
    if (idx >= 0) state.takes[idx].level = level;
    else state.takes.push({ id: uid(), stockId, userId: state.me.id, level });
    const s = stock(stockId);
    toast(takeMeta(level).title + (s ? " · " + s.name : ""));
    render();
    return;
  }
  if (act.startsWith("thread:")) {
    state.replyTo = null;
    state.threadDraft = "";
    openSheet(act);
    return;
  }
  if (act.startsWith("reply:")) {
    const input = document.getElementById("thread-text");
    if (input) state.threadDraft = input.value;
    state.replyTo = act.split(":")[1];
    render();
    return;
  }
  if (act === "cancel-reply") {
    const input = document.getElementById("thread-text");
    if (input) state.threadDraft = input.value;
    state.replyTo = null;
    render();
    return;
  }
  if (act === "do-comment") {
    const stockId = (state.sheet || "").split(":")[1];
    const text = document.getElementById("thread-text")?.value || "";
    state.threadDraft = "";
    addComment(stockId, text, state.replyTo);
    return;
  }
  if (act === "do-prop") {
    propose(document.getElementById("prop-ticker").value, document.getElementById("prop-msg").value);
    return;
  }
  if (act.startsWith("shock:")) {
    const parts = act.split(":");
    return shock(parts[1], Number(parts[2]));
  }
  if (act.startsWith("play:")) return playAs(act.split(":")[1]);
  if (act === "reset") return resetDemo();
}

render();

  </script>
