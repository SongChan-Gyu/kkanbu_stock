<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>주식 깐부 — 웹 데모</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="page">
    <aside class="desk-note">
      <p class="brand">주식 깐부</p>
      <h1>윈도우에서도 바로 플레이</h1>
      <p>
        iPhone 앱은 <strong>Mac + Xcode</strong>에서만 실행됩니다.
        이 페이지는 같은 핵심 루프를 브라우저에서 돌리는 플레이 데모입니다.
      </p>
      <ul>
        <li>Windows / Linux / Mac 브라우저 모두 OK</li>
        <li>진짜 시세·푸시·OCR은 없음 (목 데이터)</li>
        <li>친구와 실시간 멀티플레이는 없음</li>
      </ul>
      <p class="hint">시작은 <strong>데모 주식팟으로 시작</strong>을 고르세요. 영희가 NVIDIA를, 민수가 AMD를 이미 찔러 둔 상태입니다.</p>
    </aside>

    <div class="phone">
      <div class="notch"></div>
      <div id="app"></div>
    </div>
  </div>
  <div id="toast" class="toast" hidden></div>
  <script src="app.js"></script>
</body>
</html>
